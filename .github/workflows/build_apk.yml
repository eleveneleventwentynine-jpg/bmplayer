name: Build APK

# Builds a debug APK on every push/PR for quick verification, and a
# signed, split-per-ABI release build (+ GitHub Release) when a version
# tag like `v1.0.0` is pushed. Signing is optional: if the KEYSTORE_BASE64
# secret isn't set, the release build falls back to an unsigned APK so the
# pipeline never breaks on a fresh repo — see the "Set up signing" step.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.3"
  JAVA_VERSION: "17"

permissions:
  contents: write # only used by the release step, on tag pushes

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: |
          if [ -d "test" ] && [ -n "$(find test -name '*_test.dart')" ]; then
            flutter test
          else
            echo "No tests found — skipping."
          fi

      - name: Determine build type
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      # Signing is optional. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, and KEY_PASSWORD as repo secrets to produce a signed
      # release APK; without them, `flutter build apk --release` still
      # succeeds using Flutter's default debug signing config, which is
      # fine for testing but NOT for a Play Store upload.
      - name: Set up signing
        id: signing
        if: steps.params.outputs.type == 'release'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — building an unsigned/debug-signed release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          if [ "${{ steps.params.outputs.type }}" = "release" ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi

      - name: Collect build info
        run: |
          {
            echo "### bmplayer APK build"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in build/app/outputs/flutter-apk/*.apk; do
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmplayer-${{ steps.params.outputs.type }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
