name: Build APK

# Builds a debug APK on every push/PR for quick verification, and a
# signed, split-per-ABI release build (+ GitHub Release) when a version
# tag like `v1.0.0` is pushed. Signing is optional: if the KEYSTORE_BASE64
# secret isn't set, the release build falls back to an unsigned APK so the
# pipeline never breaks on a fresh repo — see the "Set up signing" step.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.3"
  JAVA_VERSION: "17"
  # Used only if android/ needs to be generated from scratch. If you've
  # already published this app, set this to match the applicationId
  # you shipped with — changing it afterward breaks updates for users.
  ANDROID_ORG: "com.bmplayer"

permissions:
  contents: write # only used by the release step, on tag pushes

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Self-healing: generates android/ if it's missing entirely, or
      # regenerates it if it predates Flutter's current Gradle template
      # (the "unsupported Gradle project" error). This means the workflow
      # never depends on whatever happens to be committed to the repo.
      - name: Ensure Android project scaffold is current
        run: |
          NEEDS_REGEN=false
          if [ ! -f "android/settings.gradle" ]; then
            echo "No android/ project found — generating one."
            NEEDS_REGEN=true
          elif ! grep -q "pluginManagement" android/settings.gradle; then
            echo "android/settings.gradle predates the current Gradle plugin loader — regenerating android/."
            rm -rf android
            NEEDS_REGEN=true
          fi
          if [ "$NEEDS_REGEN" = "true" ]; then
            flutter create --platforms=android --org "${{ env.ANDROID_ORG }}" --project-name bmplayer .
          fi

      # Idempotent: only adds permissions that aren't already declared,
      # so it's safe to run on both a freshly generated manifest and one
      # you've customized by hand.
      - name: Apply required Android manifest permissions
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          required = [
              "android.permission.INTERNET",
              "android.permission.READ_MEDIA_AUDIO",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
          ]
          missing = [p for p in required if p not in content]

          if missing:
              lines = "".join(f'    <uses-permission android:name="{p}" />\n' for p in missing)
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r"\1\n" + lines.rstrip("\n"),
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Added missing permissions: {', '.join(missing)}")
          else:
              print("All required permissions already present.")
          PY

      # Idempotent (guarded by a marker comment): backfills a missing
      # Android Gradle `namespace` from each plugin's own
      # AndroidManifest.xml `package` attribute. Several older plugins
      # (e.g. on_audio_query) don't declare `namespace` in their own
      # build.gradle, which AGP 8+ requires — this fails the build with
      # "Namespace not specified" otherwise, and can't be fixed from the
      # app side except by patching Gradle's evaluation like this. Hooks
      # into plugin application (plugins.withId) rather than
      # subproject.afterEvaluate, since afterEvaluate throws
      # "already evaluated" once Gradle's own evaluation ordering runs
      # ahead of ours — plugin application always fires safely regardless
      # of each subproject's evaluation state.
      - name: Patch Android namespace fallback for legacy plugins
        run: |
          MARKER="bmplayer: namespace fallback for legacy plugins"
          GRADLE_FILE="android/build.gradle"
          if ! grep -q "$MARKER" "$GRADLE_FILE"; then
            cat >> "$GRADLE_FILE" <<'GRADLE'

          // --- bmplayer: namespace fallback for legacy plugins ---
          // Backfills a missing Android Gradle `namespace` from each
          // plugin's own AndroidManifest.xml `package` attribute, for
          // plugins that haven't been updated for AGP 8's requirement
          // that every module declare one explicitly. Runs on plugin
          // application, not afterEvaluate, so it can't collide with
          // Gradle's own evaluation ordering.
          subprojects { subproject ->
              subproject.plugins.withId("com.android.library") {
                  def androidExtension = subproject.extensions.findByName('android')
                  if (androidExtension != null) {
                      try {
                          if (androidExtension.namespace == null) {
                              def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                              if (manifestFile.exists()) {
                                  def manifestXml = new XmlSlurper().parse(manifestFile)
                                  def packageName = manifestXml.@package?.text()
                                  if (packageName) {
                                      androidExtension.namespace = packageName
                                  }
                              }
                          }
                      } catch (ignored) {
                          // AGP without a settable `namespace` property — nothing to backfill.
                      }
                  }
              }
          }
          GRADLE
            echo "Appended namespace fallback to $GRADLE_FILE"
          else
            echo "Namespace fallback already present — skipping."
          fi

      # Auto-formats the code and commits the result back to the branch,
      # so nobody has to remember to run `dart format` locally. Skipped on
      # PRs from forks, which don't have write access to push a commit.
      - name: Format code
        run: dart format .

      - name: Commit formatting changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format with dart format [skip ci]"
          file_pattern: "*.dart"

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: |
          if [ -d "test" ] && [ -n "$(find test -name '*_test.dart')" ]; then
            flutter test
          else
            echo "No tests found — skipping."
          fi

      - name: Determine build type
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      # Signing is optional. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, and KEY_PASSWORD as repo secrets to produce a signed
      # release APK; without them, `flutter build apk --release` still
      # succeeds using Flutter's default debug signing config, which is
      # fine for testing but NOT for a Play Store upload.
      - name: Set up signing
        id: signing
        if: steps.params.outputs.type == 'release'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — building an unsigned/debug-signed release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          if [ "${{ steps.params.outputs.type }}" = "release" ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi

      - name: Collect build info
        run: |
          {
            echo "### bmplayer APK build"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in build/app/outputs/flutter-apk/*.apk; do
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmplayer-${{ steps.params.outputs.type }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
